<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#3b6e5a"/>
  <!-- drei gestapelte Mahjong-Steine -->
  <g>
    <!-- unterer Stein -->
    <rect x="96"  y="240" width="220" height="180" rx="22" fill="#fdf8ec" stroke="#6c6354" stroke-width="6"/>
    <text x="206" y="365" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" font-size="118" text-anchor="middle">🌸</text>
    <!-- mittlerer Stein, leicht versetzt -->
    <rect x="170" y="170" width="220" height="180" rx="22" fill="#fdf8ec" stroke="#6c6354" stroke-width="6"/>
    <text x="280" y="295" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" font-size="118" text-anchor="middle">🐲</text>
    <!-- oberer Stein -->
    <rect x="244" y="100" width="220" height="180" rx="22" fill="#fdf8ec" stroke="#6c6354" stroke-width="6"/>
    <text x="354" y="225" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" font-size="118" text-anchor="middle">🍀</text>
  </g>
</svg>
